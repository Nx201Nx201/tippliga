services:
  - type: web
    name: tippliga
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt && python -m compileall -q .
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: TIPPLIGA_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "1"
